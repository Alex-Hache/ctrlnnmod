# Calcul distant gratuit (dépôt public) : chaque ligne de compute/jobs.json devient un job
# (4 vCPU, 16 Go). Les sorties sont rassemblées sur la branche `compute-results`,
# dans runs/<tag>/.
name: compute
on:
  push:
    branches: [compute]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 -c "import json; d=json.load(open('compute/jobs.json')); print('matrix='+json.dumps({'job': d['jobs']})); print('tag='+d['tag'])" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r compute/requirements.txt
      - name: Run
        env:
          OUT_DIR: out/${{ matrix.job.name }}
          NTHREADS: "4"
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PYTHONPATH: ".:experiments/closed_loop:experiments/world_model"
        run: |
          mkdir -p "$OUT_DIR"
          ( ${{ matrix.job.cmd }} ) 2>&1 | tee "$OUT_DIR/log.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.job.name }}
          path: out/
      - name: Push this job's results now (do not wait for the other jobs)
        if: always()
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          NAME: ${{ matrix.job.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/r" && cd "$RUNNER_TEMP/r" && git init -q
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git checkout -q -b compute-results
          for i in 1 2 3 4 5 6; do
            if git fetch -q origin compute-results; then git reset -q --hard FETCH_HEAD; fi
            mkdir -p "runs/$TAG" && cp -r "$GITHUB_WORKSPACE/out/$NAME" "runs/$TAG/" || exit 0
            git add runs && (git commit -qm "results $TAG/$NAME" || exit 0)
            if git push -q origin compute-results; then exit 0; fi
            sleep $(( (RANDOM % 15) + 5 ))
          done
          exit 1
