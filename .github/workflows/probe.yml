name: compute-probe
on:
  push:
    branches: [compute-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out && { nproc; free -g | head -2; python3 --version; } > out/probe.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -b compute-results-probe && git add out && git commit -m probe && git push -f origin compute-results-probe
